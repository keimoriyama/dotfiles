repos:
  - repo: local
    hooks:
      - id: emacs-lisp-tests
        name: Emacs Lisp ERT tests
        entry: bash home-manager/emacs/run-tests.sh
        language: system
        pass_filenames: false
        files: ^home-manager/emacs/(init\.org|agent-shell-provider-usage(-tests)?\.el|nippo-org-journal(-tests)?\.el|org-archive-tests\.el)$
