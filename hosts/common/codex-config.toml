# Codex のシステム設定 (/etc/codex/config.toml)。~/.codex/config.toml は Codex 自身が
# 書き換えるため dotfiles では管理せず、こちらに既定の permission profile を置く。
default_permissions = "ghq"

# ホーム配下は ~/ghq だけを読み書きできる。ツールの実行に要るシステム側のパスは読み取りを許す。
[permissions.ghq.filesystem]
":minimal" = "read"
"/nix" = "read"
"/etc" = "read"
"/private/etc" = "read"
"/run" = "read"
"~/.config/git" = "read"
"~/ghq" = "write"
":tmpdir" = "write"

# 開発ツールの設定は読み取り、キャッシュやインストール先は読み書きを許す。
"~/.config/uv" = "read"
"~/.config/cabal" = "read"
"~/.cache/uv" = "write"
"~/.local/share/uv" = "write"
"~/.local/bin" = "write"
"~/.cargo" = "write"
"~/.rustup" = "write"
"~/.npm" = "write"
"~/.cabal" = "write"
"~/.cache/cabal" = "write"
"~/.local/state/cabal" = "write"
"~/.cache/ruff" = "write"
"~/.cache/ty" = "write"
"~/.cache/pre-commit" = "write"
"~/Library/Caches/pip" = "write"
"~/Library/Caches/typst" = "write"

# 上で許したディレクトリ内の認証情報は読ませない。
"~/.cargo/credentials" = "deny"
"~/.cargo/credentials.toml" = "deny"
"~/.local/share/uv/credentials" = "deny"

[permissions.ghq.network]
enabled = true
