# -*- coding: utf-8 -*-
#
# このファイルは：
# macSKKでAZIKを使うためのローマ字変換ルールです。
# Emacs の ddskk (skk-azik.el) と同じ打鍵になるよう、ddskk の実効ルール
# (skk-rom-kana-rule-list + skk-rom-kana-base-rule-list、前者が優先) を
# そのまま書き出したものです。ddskk 側のカスタマイズは
# home-manager/emacs/init.org の ddskk セクションにあります。
#
# 括弧は ddskk と同じ配置です。x[ が 「、] が 」、z[ z] が 『 』、
# z{ z} が 【 】。[ 単独は ddskk では文字ではなくカタカナ切り替えなので、
# ここには書かず macSKK のキー割り当て側で合わせます (下記)。
#
# ddskk が文字ではなくコマンドに割り当てているキーは書き出していません。
# macSKK 側は「設定 → キー割り当て」で合わせる必要があります:
#   [ ... かなカナモード切り替え (toggleKana)。macSKK の既定は q だが、
#         AZIK では q は「ん」なので [ へ移すこと。
#   l / Q X ... ddskk と macSKK の既定が一致しているので変更不要。
#   \ $ @ { ... ddskk 固有 (コード入力・日付など)。macSKK に対応機能なし。
# 読点・句点・長音 (, . -) は skk-kutouten-type が jp のときの値です。
#
# 更新の手順：
# 1. Emacs で ddskk を起動し、skk-rom-kana-rule-list と
#    skk-rom-kana-base-rule-list をダンプする
# 2. key,ひらがな,カタカナ[,半角カナ,未確定ローマ字] の形式に変換して
#    下のルール部分を丸ごと差し替える
#
# ------------------------------
#
# ひらかな・カタカナ・半角カナ入力モードでのキー入力変換マップ
# UTF-8 + LF (BOMなし) で記述してください。
# #で始まる行は無視されます。

# 自分でカスタマイズして使用したい場合はこのファイルを
# ~/Library/Containers/net.mtgto.inputmethod.macSKK/Data/Documents/Settings/kana-rule.conf
# に置いてください。

# 各行はカンマ区切りで2-5要素記述する必要があります。
# 各要素でカンマを使用したい場合は &comma; と記述してください。
# 第一要素でシャープを使用したい場合は &sharp; と記述してください。
# 1つ目: ローマ字入力で確定入力されるまでに入力される文字列を指定してください。
# 2つ目: ひらがなモードで入力される文字を指定してください。
# 3つ目: カタカナモードで入力される文字を指定してください。
# 省略時はひらがなモードで入力される文字を自動でカタカナに変換します。
# 記号などはカタカナに変換できないのでそのまま使用されます。
# 4つ目: 半角カナ入力モードで入力される文字を指定してください。
# 省略時はひらがなモードで入力される文字を自動で半角に変換します。
# 5つ目: 未確定のローマ字として残す文字を指定してください。
# 省略された場合は未確定文字として残るローマ字がないことを表します。
# 例えば "tt,っ,ッ,ｯ,t" という行がある場合、
# "tt" と入力したときには "っ" をひらがなモードで入力し "t" が未確定のローマ字として残ります。


# ルール ここから (ddskk と一致) -----------------------------

